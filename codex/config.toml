model = "gpt-5.6-sol"
model_reasoning_effort = "high"
approval_policy = "on-request"
sandbox_mode = "workspace-write"

[sandbox_workspace_write]
network_access = true

[notice.model_migrations]
"gpt-5.3-codex" = "gpt-5.4"
"gpt-5.4" = "gpt-5.6-sol"

[tui.model_availability_nux]
"gpt-5.5" = 4

[tui]
alternate_screen = "never"
show_tooltips = false
status_line = ["model-with-reasoning", "context-used", "current-dir", "git-branch", "thread-name"]

[agents]
max_threads = 12
max_depth = 1
